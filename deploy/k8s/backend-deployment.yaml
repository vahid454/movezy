apiVersion: apps/v1
kind: Deployment
metadata:
  name: movezy-backend
  labels:
    app: movezy-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movezy-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: movezy-backend
    spec:
      containers:
        - name: backend
          image: movezy/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: ENABLE_AUDIT_LOGS
              value: "true"
            - name: ENABLE_REQUEST_LOGS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
