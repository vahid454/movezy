services:
  - type: web
    name: movezy-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: your_mongodb_uri
      - key: JWT_SECRET
        value: super_secret_change_this
      - key: JWT_EXPIRE
        value: 7d
      - key: OTP_DEV_MODE
        value: true
      - key: OTP_DEV_CODE
        value: 102030
      - key: ADMIN_SECRET_KEY
        value: your_admin_key
      - key: CORS_ORIGINS
        value: https://movezy-admin.onrender.com
      - key: ENABLE_STRICT_BOOKING_POLICY
        value: false
      - key: ENABLE_IDEMPOTENCY_KEYS
        value: false
      - key: RATE_LIMIT_MAX
        value: 150
      - key: AUTH_RATE_LIMIT_MAX
        value: 30
      - key: BOOKING_ACTION_RATE_LIMIT_MAX
        value: 50
      - key: LOCATION_RATE_LIMIT_MAX
        value: 120
      - key: GOOGLE_MAPS_SERVER_API_KEY
        value: your_google_maps_server_key
      - key: FIREBASE_PROJECT_ID
        value: your_firebase_project_id
      - key: FIREBASE_CLIENT_EMAIL
        value: your_service_account_client_email
      - key: FIREBASE_PRIVATE_KEY
        value: "-----BEGIN PRIVATE KEY-----\\nYOUR_KEY_CONTENT\\n-----END PRIVATE KEY-----\\n"
      - key: ENABLE_AUDIT_LOGS
        value: true
      - key: ENABLE_REQUEST_LOGS
        value: true

  - type: web
    name: movezy-admin
    env: node
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build
    plan: free
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_URL
        value: https://movezy-backend.onrender.com/api