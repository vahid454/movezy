name: movezy
description: Movezy - Transport App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.1

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_messaging: ^14.7.19

  # Realtime
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.2.3

  # UI
  pinput: ^3.0.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  url_launcher: ^6.2.6
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  intl: ^0.19.0
  timeago: ^3.6.1
  connectivity_plus: ^6.0.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FF6B00"
  adaptive_icon_foreground: assets/images/app_icon.png
  # Larger inset = smaller foreground on the home screen (more orange, centered).
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true
  assets:
    - assets/images/
